<title>Current Affairs Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#04060c; --side:#060914; --card:#0a0f1d; --ink:#e9f1ff; --ink2:#b3c1dc; --muted:#6c7c9c;
  --line:#141d33; --line2:#223152; --hover:#0e1730; --grid:rgba(110,150,255,.05);
  --accent:#00e5ff; --accent2:#7b61ff; --accent-ink:#001318; --accent-soft:rgba(0,229,255,.09);
  --good:#37ffab; --good-soft:rgba(55,255,171,.09); --bad:#ff5c8a; --bad-soft:rgba(255,92,138,.10);
  --fact:rgba(255,196,0,.07); --fact-line:rgba(255,196,0,.28);
  --gs1:#ffb020; --gs2:#5b8cff; --gs3:#2dffb3; --gs4:#b36bff; --essay:#ff4fb0; --prelims:#8fa3c4;
  --glow:0 0 0 1px rgba(0,229,255,.18),0 0 28px rgba(0,229,255,.12);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 34px rgba(0,0,0,.45);
  --display:"Playfair Display",ui-serif,"New York",Georgia,serif;
  --serif:"Playfair Display",ui-serif,"New York",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#edf0f6; --side:#e6eaf2; --card:#ffffff; --ink:#0a1224; --ink2:#35425e; --muted:#6a7893;
  --line:#dde3ee; --line2:#c8d1e2; --hover:#e3e9f4; --grid:rgba(20,50,120,.05);
  --accent:#0057ff; --accent2:#7b3cff; --accent-ink:#fff; --accent-soft:rgba(0,87,255,.08);
  --good:#0b8a55; --good-soft:rgba(11,138,85,.09); --bad:#c8264f; --bad-soft:rgba(200,38,79,.08);
  --fact:#fff7dc; --fact-line:#ecd98f;
  --gs1:#b7791f; --gs2:#2f5fd0; --gs3:#18794e; --gs4:#7a3fd1; --essay:#c0347a; --prelims:#56606e;
  --glow:0 0 0 1px rgba(0,87,255,.25),0 6px 24px rgba(0,87,255,.12);
  --shadow:0 1px 2px rgba(10,20,50,.05),0 8px 26px rgba(10,20,50,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:276px minmax(0,1fr) 240px;min-height:100vh}
.app.norail{grid-template-columns:276px minmax(0,1fr)}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);border-right:1px solid var(--line);
  padding:20px 14px 14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px/1 var(--serif)}
.brand b{display:block;font:600 16px/1.2 var(--serif)}.brand span{font-size:12px;color:var(--muted)}
.search{position:relative;display:block}
.search input{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:9px 12px 9px 34px;font-size:14px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--sans);color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.navlabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 6px 6px}
.nav{display:flex;flex-direction:column;gap:1px}
.navlink{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;font-size:14px;color:var(--ink2)}
.navlink:hover{background:var(--hover);text-decoration:none}.navlink.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.navlink .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.navlink .n.due{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;font-weight:600}
.papers{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.pchip{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.pchip:hover{border-color:var(--muted);text-decoration:none}.pchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.days{display:flex;flex-direction:column;gap:1px}
.month{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 6px 4px}
.day{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;color:var(--ink2);font-size:14px}
.day:hover{background:var(--hover);text-decoration:none}.day.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.day .dn{font:600 17px/1 var(--serif);text-align:center;color:var(--ink)}
.day .dw{font-size:12px;color:var(--muted);line-height:1.2}.day .dw b{display:block;font-weight:500;color:var(--ink2);font-size:13px}
.ring{width:22px;height:22px}
.sidefoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted);text-decoration:none}.btn[aria-disabled="true"],.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{padding:3px 9px;font-size:12px}
.go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.go:hover{text-decoration:none;filter:brightness(1.05)}

/* ---------- main ---------- */
.main{min-width:0;padding:36px clamp(16px,4vw,52px) 120px}
.wrap{max-width:780px;margin:0 auto}.wrap.wide{max-width:980px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font:600 clamp(28px,4.2vw,40px)/1.12 var(--serif);letter-spacing:-.015em;margin:6px 0 10px}
h2.sec-title{font:600 20px/1.3 var(--serif);margin:34px 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec-title a{font:500 13px var(--sans);margin-left:auto}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pager{display:flex;gap:8px;margin-left:auto}
.progress{margin:20px 0 24px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.empty{color:var(--muted);text-align:center;padding:50px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:24px}
.panel h2{font:600 19px/1.3 var(--serif);margin:0 0 12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.gsl{display:flex;gap:5px;flex-wrap:wrap}
mark{background:var(--fact);color:inherit;border-radius:3px;padding:0 2px}

/* home */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);color:var(--ink);display:block}
.tile:hover{text-decoration:none;border-color:var(--line2)}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}.tile .v{font:600 28px/1.15 var(--serif);margin:4px 0 2px}.tile .s{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:170px 1fr 70px;gap:12px;align-items:center;font-size:13.5px}
.brow .bar{height:8px}.brow .bar i{background:var(--c,var(--good))}.brow .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.focus{display:flex;flex-wrap:wrap;gap:8px}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--gs1);background:color-mix(in srgb,var(--gs1) 12%,transparent);border-radius:99px;padding:3px 10px}

/* topic cards grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:26px}
.tcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px 15px;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s,border-color .15s;position:relative}
.tcard:hover{transform:translateY(-1px);border-color:var(--line2);text-decoration:none}
.tcard .no{font:600 13px/1 var(--serif);color:var(--muted)}
.tcard h3{font:600 16.5px/1.3 var(--serif);margin:6px 0 6px;padding-right:20px}
.tcard p{margin:0 0 10px;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tick{position:absolute;top:13px;right:13px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2)}
.tick.yes{background:var(--good);border-color:var(--good)}
.tick.yes::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(45deg)}
.bites{margin:0;padding:0;list-style:none;columns:2;column-gap:28px}
.bites li{break-inside:avoid;font-size:14px;color:var(--ink2);padding:7px 0 7px 22px;position:relative;border-bottom:1px dashed var(--line)}
.bites li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.bites a{font-size:12px;color:var(--muted)}
.litechip{font-size:12px;font-weight:600;color:var(--gs1);background:color-mix(in srgb,var(--gs1) 12%,transparent);border-radius:99px;padding:2px 9px}

/* topic article */
.topic{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px clamp(18px,4vw,38px) 24px;margin-bottom:26px}
.thead{display:flex;gap:16px;align-items:flex-start}
.tnum{font:500 44px/0.9 var(--serif);color:var(--line2);flex:none;min-width:52px;letter-spacing:-.03em}
.topic h2{font:600 clamp(22px,2.8vw,27px)/1.25 var(--serif);letter-spacing:-.01em;margin:6px 0 8px}
.syl{font-size:13px;color:var(--muted);line-height:1.45}
.why{margin:20px 0 6px;background:var(--accent-soft);border-radius:12px;padding:14px 16px 14px 18px;border-left:3px solid var(--accent);font-size:15.5px}
.why b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.sec{margin-top:24px}
.sec>h4{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px}
.sec>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.prose p{margin:0 0 12px;color:var(--ink2);max-width:68ch}
.list{margin:0;padding:0;list-style:none}
.list li{position:relative;padding:4px 0 4px 22px;color:var(--ink2)}
.list li::before{content:"";position:absolute;left:5px;top:14px;width:6px;height:6px;border-radius:50%;background:var(--muted)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:4px 0 4px 32px;color:var(--ink2)}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:21px;height:21px;border-radius:50%;background:var(--hover);font-size:12px;font-weight:600;display:grid;place-items:center;color:var(--ink2)}
.statics{margin:0;padding:0;list-style:none;border-left:3px solid var(--gs2);background:color-mix(in srgb,var(--gs2) 6%,transparent);border-radius:0 12px 12px 0}
.statics li{padding:7px 14px;font-size:14.5px;color:var(--ink2)}.statics li+li{border-top:1px solid var(--line)}
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.concept{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--bg)}
.concept b{display:block;font-size:14px;margin-bottom:3px}.concept span{font-size:13.5px;color:var(--ink2);line-height:1.5}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side-good,.side-bad{border-radius:12px;padding:12px 14px}
.side-good{background:var(--good-soft)}.side-bad{background:var(--bad-soft)}
.side-good h5,.side-bad h5{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.side-good h5{color:var(--good)}.side-bad h5{color:var(--bad)}
.side-good .list li::before{background:var(--good)}.side-bad .list li::before{background:var(--bad)}
.side-good .list li,.side-bad .list li{font-size:14.5px}
.facts{margin:0;padding:0;list-style:none;border:1px solid var(--fact-line);border-radius:12px;overflow:hidden}
.facts li{background:var(--fact);padding:9px 14px 9px 38px;position:relative;font-size:14.5px}
.facts li+li{border-top:1px solid var(--fact-line)}
.facts li::before{content:"★";position:absolute;left:14px;top:9px;color:#c99a06;font-size:13px}
.mains{border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
.mains .q{font:500 16.5px/1.5 var(--serif);margin:0 0 8px;white-space:pre-line}
.toggle{border:0;background:none;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 0}
.reveal{margin-top:6px;display:none}.reveal.open{display:block}
.mcq{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px;background:var(--card)}
.mcq .qq{font-size:15px;margin-bottom:10px;white-space:pre-line}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14.5px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt .l{flex:none;width:22px;height:22px;border-radius:6px;background:var(--hover);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.right .l{background:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .l{background:var(--bad);color:var(--card)}
.mcq.done .opt{cursor:default}
.explain{display:none;margin-top:10px;font-size:14px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:10px 12px}
.mcq.done .explain{display:block}
.ai{font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.tfoot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kws{display:flex;flex-wrap:wrap;gap:6px;flex:1}.kw{font-size:12.5px;background:var(--hover);border-radius:6px;padding:2px 8px;color:var(--ink2)}
.srcs{font-size:13px;color:var(--muted);width:100%}.srcs a{display:inline-block;margin-right:12px}
.acts{display:flex;gap:6px;align-items:center}
.iconbtn{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn.star.on{color:#c99a06;border-color:#e3c35a}.iconbtn.star.on svg{fill:#e8b923;stroke:#c99a06}
.iconbtn.rev.on{background:var(--good);border-color:var(--good);color:var(--card)}
.iconbtn.note.on{color:var(--gs2);border-color:color-mix(in srgb,var(--gs2) 50%,transparent)}
.notebox{width:100%;display:none}.notebox.open{display:block}
.notebox textarea{width:100%;min-height:90px;border:1px solid var(--line2);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;resize:vertical;outline:none}
.notebox textarea:focus{border-color:var(--gs2)}
.notebox small{color:var(--muted);font-size:12px}
.disclaimer{font-size:12.5px;color:var(--muted);text-align:center;margin:40px auto 0;max-width:580px}

/* PYQs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tab{padding:9px 14px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink);text-decoration:none}.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-weight:400;font-size:12.5px;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.filters select,.filters input[type=search]{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 10px;font-size:13.5px;outline:none;max-width:100%}
.filters input[type=search]{flex:1;min-width:160px}
.filters label{font-size:13px;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.subj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.subj h3{font:600 16px/1.3 var(--serif);margin:0 0 8px}
.subj a{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--ink2);padding:3px 0}
.subj a span{color:var(--muted);font-variant-numeric:tabular-nums}.subj a:hover{color:var(--accent);text-decoration:none}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.qhead b{color:var(--ink2);font-weight:600}
.qtext{font:500 16px/1.55 var(--serif);white-space:pre-line;margin:0 0 6px}
.qcard .mcq{border:0;padding:0;margin:0}
.qcard .mcq .qq{font:500 16px/1.55 var(--serif)}
.outline h5{margin:10px 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.outline p{margin:0;color:var(--ink2);font-size:14.5px}
.more{display:flex;justify-content:center;margin:16px 0}

/* practice + flashcards */
.setup{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 24px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:7px 13px;font-size:13.5px;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line2)}.seg button.on{background:var(--ink);color:var(--bg)}
.setup select{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 10px;font-size:13.5px}
.score{display:flex;gap:18px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:12px}
.score b{color:var(--ink);font-size:18px;font-family:var(--serif)}
.from{font-size:12.5px;color:var(--muted);margin-top:8px}
.fcard{cursor:pointer;margin:10px 0 16px}
.fface{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.fface .ft{font:600 clamp(22px,3vw,28px)/1.3 var(--serif);text-align:center}
.fface .fb{font-size:16.5px;line-height:1.6;color:var(--ink2);text-align:center;border-top:1px solid var(--line);padding-top:14px}
.fface .fm{font-size:12.5px;color:var(--muted);text-align:center}
.fbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fbtns button{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 6px;cursor:pointer;font-weight:600;font-size:14px}
.fbtns button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.fbtns .again{color:var(--bad)}.fbtns .good{color:var(--good)}

/* lists */
.row{display:grid;grid-template-columns:86px 1fr auto;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--ink);margin-bottom:8px;align-items:start}
.row:hover{border-color:var(--line2);text-decoration:none}
.row .rd{font-size:12.5px;color:var(--muted);line-height:1.35;padding-top:3px}.row .rd b{display:block;font:600 18px/1.1 var(--serif);color:var(--ink)}
.row h3{font:600 16px/1.35 var(--serif);margin:0 0 4px}.row p{margin:0;font-size:13.5px;color:var(--muted)}
.row .mynote{margin-top:6px;font-size:13.5px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:6px 10px;white-space:pre-line}
a.row{grid-template-columns:86px 1fr}

/* right rail */
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:42px 18px 20px 4px}
.rail h6{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 12px}
.rail a{display:flex;gap:8px;font-size:13px;line-height:1.35;color:var(--muted);padding:5px 10px;border-left:2px solid var(--line)}
.rail a:hover{color:var(--ink);text-decoration:none}.rail a.on{color:var(--ink);border-left-color:var(--accent);font-weight:500}
.rail a .rt{color:var(--good);font-weight:700;margin-left:auto}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
.lock[hidden]{display:none}
.lockcard{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lockcard .logo{margin:0 auto 4px;width:44px;height:44px;font-size:20px}
.lockcard h1{font-size:26px;margin:0}.lockcard p{margin:0 0 6px;color:var(--muted);font-size:14px}
.lockcard input[type=password]{border:1px solid var(--line2);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:15px;outline:none}
.lockcard input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lockcard .go{justify-content:center}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted)}
.lockerr{min-height:18px;font-size:13px;color:var(--bad)}

/* mobile */
.topbar,.scrim{display:none}
@media (max-width:1240px){.app,.app.norail{grid-template-columns:262px minmax(0,1fr)}.rail{display:none}}
@media (max-width:880px){
  html{scroll-padding-top:72px}
  .app,.app.norail{display:block}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
  .topbar b{font:600 16px var(--serif)}
  .menubtn{border:1px solid var(--line2);background:var(--card);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
  .side{position:fixed;z-index:40;left:0;top:0;width:290px;max-width:86vw;transform:translateX(-102%);transition:transform .22s;box-shadow:var(--shadow)}
  body.menu .side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35)}
  .main{padding:20px 16px 90px}
  .grid,.concepts,.duo,.subjects{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bites{columns:1}
  .pager{margin-left:0}
  .tnum{font-size:34px;min-width:38px}.thead{gap:10px}
  .brow{grid-template-columns:110px 1fr 52px}
  .filters{top:57px}
  .row,a.row{grid-template-columns:1fr;gap:4px}.row .rd b{display:inline;font-size:14px;margin-right:6px}
  .fbtns{grid-template-columns:repeat(2,1fr)}
}
@media print{
  .side,.rail,.topbar,.pager,.progress,.grid,.acts,.toggle,.disclaimer,.filters,.tabs{display:none!important}
  .app{display:block}.main{padding:0}body{background:#fff}
  .topic,.panel,.qcard{box-shadow:none;break-inside:auto;border-color:#ccc}.reveal{display:block!important}
  .mcq .explain{display:block}
}

/* ================= futuristic skin ================= */
::selection{background:var(--accent);color:var(--accent-ink)}
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 520px at 88% -12%,rgba(0,229,255,.10),transparent 62%),
  radial-gradient(760px 520px at -6% 108%,rgba(123,97,255,.11),transparent 60%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 44px}
html{scrollbar-color:var(--line2) transparent;scrollbar-width:thin}
.side{background:linear-gradient(180deg,var(--side),color-mix(in srgb,var(--side) 88%,#000));border-right:1px solid var(--line2)}
.eyebrow,.navlabel,.month,.qhead,.tab,.meta,.score,.from,.stat,#stat{font-family:var(--mono)}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent)}
.eyebrow::before{content:"// ";opacity:.6}
.navlabel,.month{letter-spacing:.18em;font-size:10.5px}
.badge{font-family:var(--mono);letter-spacing:.06em;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:4px;background:color-mix(in srgb,var(--c) 9%,transparent);text-transform:uppercase;font-size:10.5px}
h1{font-family:var(--display);font-weight:700;letter-spacing:-.025em}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 0 18px;margin:0 0 26px;border-bottom:1px solid var(--line2);position:relative}
.mast::after{content:"";position:absolute;left:0;bottom:-1px;width:120px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent)}
.wordmark{font:800 clamp(40px,6.4vw,76px)/.9 var(--display);letter-spacing:-.04em;color:var(--ink)}
.wordmark:hover{text-decoration:none}
.wordmark i{font-style:normal;color:var(--accent);text-shadow:0 0 18px var(--accent)}
.tagline{display:block;margin-top:10px;font:500 10.5px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.hud{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font:500 11px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.hud b{color:var(--ink);font-weight:600;font-size:13px;letter-spacing:.1em}
.hud .live{font-style:normal;color:var(--good);display:inline-flex;align-items:center;gap:7px}
.hud .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* section titles with the rule line, like a newspaper */
h2.sec-title,.panel h2{display:flex;align-items:center;gap:14px;font:500 clamp(20px,2.4vw,26px)/1.2 var(--display);letter-spacing:-.01em;text-transform:lowercase}
h2.sec-title::after,.panel h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
h2.sec-title a{order:3;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.sec>h4{font-family:var(--mono);letter-spacing:.2em;font-size:10.5px;color:var(--accent)}
.sec>h4::before{content:"▸";color:var(--accent)}

/* cards: bracket corners, glow on hover */
.tcard,.qcard,.panel,.tile,.subj,.mcq,.concept,.mains,.row,.fface,.lockcard,.topic{border:1px solid var(--line2);background:linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,#fff 3%),var(--card))}
.tcard,.tile,.subj,.qcard,.panel,.topic{position:relative}
.tcard::before,.tile::before,.subj::before,.qcard::before,.panel::before,.topic::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);border-radius:3px 0 0 0;opacity:.8;pointer-events:none}
.tcard::after,.tile::after,.subj::after,.qcard::after,.panel::after,.topic::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--accent2);border-right:2px solid var(--accent2);border-radius:0 0 3px 0;opacity:.7;pointer-events:none}
.tcard:hover,.tile:hover,.row:hover{border-color:var(--accent);box-shadow:var(--glow)}
.tcard .no,.tnum{font-family:var(--mono)}
.tnum{color:transparent;-webkit-text-stroke:1px var(--accent);font-weight:300;opacity:.75;letter-spacing:-.02em}
.tile .v{font-family:var(--display);background:linear-gradient(90deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.why{border-left:2px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),transparent)}
.why b{font-family:var(--mono);letter-spacing:.2em;color:var(--accent)}
.statics{border-left-color:var(--accent2)}
.facts li::before{color:var(--gs1)}

/* controls */
.go{background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 35%,transparent);border-radius:8px;letter-spacing:.02em}
.go:hover{filter:brightness(1.12)}
.btn,.iconbtn,.pchip,.seg,.themebtn{border-color:var(--line2)}
.btn:hover,.iconbtn:hover,.pchip:hover{border-color:var(--accent);color:var(--ink)}
.pchip.on,.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.navlink.on,.day.on{background:linear-gradient(90deg,var(--accent-soft),transparent);box-shadow:inset 2px 0 0 var(--accent);color:var(--ink)}
.navlink.on{font-weight:600}
.tab.on{border-bottom-color:var(--accent);color:var(--ink);text-shadow:0 0 14px color-mix(in srgb,var(--accent) 50%,transparent)}
.bar i,.brow .bar i{background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
.iconbtn.rev.on{box-shadow:0 0 14px color-mix(in srgb,var(--good) 45%,transparent)}
.opt.right{box-shadow:0 0 0 1px var(--good),0 0 18px color-mix(in srgb,var(--good) 25%,transparent)}
.opt.wrong{box-shadow:0 0 0 1px var(--bad)}
.logo{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent);border-radius:8px}
.tick.yes{box-shadow:0 0 10px var(--good)}
.search input:focus{box-shadow:0 0 0 3px var(--accent-soft),0 0 16px color-mix(in srgb,var(--accent) 25%,transparent)}
.lock{background:radial-gradient(700px 500px at 50% 0,rgba(0,229,255,.12),transparent 65%),var(--bg)}
.lockcard h1{font-family:var(--display)}

@media (prefers-reduced-motion:no-preference){
  .tcard,.qcard,.tile,.subj,.panel{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  .grid .tcard:nth-child(2){animation-delay:.04s}.grid .tcard:nth-child(3){animation-delay:.08s}.grid .tcard:nth-child(4){animation-delay:.12s}
  .grid .tcard:nth-child(5){animation-delay:.16s}.grid .tcard:nth-child(6){animation-delay:.2s}
  @keyframes rise{from{opacity:0;translate:0 10px}to{opacity:1;translate:none}}
}
@media (max-width:880px){.mast{align-items:flex-start;flex-direction:column;gap:14px}.hud{align-items:flex-start;flex-direction:row;flex-wrap:wrap;gap:6px 16px}}
@media print{body::before{display:none}.mast{display:none}}

/* ================= round 2: front page, ticker, scanlines ================= */
:root[data-theme="dark"] body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 3px)}
.edition{display:block;margin-top:6px;font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.85}
.wordmark{position:relative;display:inline-block}
.wordmark:hover{animation:glitch .45s steps(2) 1}
@keyframes glitch{20%{text-shadow:2px 0 var(--accent),-2px 0 var(--essay);transform:translateX(1px)}60%{text-shadow:-2px 0 var(--accent),2px 0 var(--essay);transform:translateX(-1px)}100%{text-shadow:none;transform:none}}

/* ticker */
.ticker{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin:6px 0 4px;background:linear-gradient(90deg,var(--accent-soft),transparent)}
.ticker b{flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--accent);color:var(--accent-ink);font:700 10.5px var(--mono);letter-spacing:.18em;text-transform:uppercase}
.ticker b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-ink);animation:pulse 1.4s ease-in-out infinite}
.ticker .viewport{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker .track{display:inline-flex;gap:46px;padding:9px 0;white-space:nowrap;animation:marquee 140s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker span{font:500 12.5px var(--mono);color:var(--ink2)}
.ticker span::before{content:"◆";color:var(--accent);margin-right:12px;font-size:9px}
@keyframes marquee{to{transform:translateX(-50%)}}

/* newspaper front page: one lead story beside the rest */
.front{display:grid;grid-template-columns:1.6fr 1fr 1fr;grid-auto-rows:minmax(0,auto);gap:14px;margin-bottom:28px}
.front .lead{grid-row:span 3;padding:26px 26px 22px;display:flex;flex-direction:column;justify-content:flex-end;min-height:360px;
  background:radial-gradient(520px 260px at 0 0,var(--accent-soft),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,#fff 4%),var(--card));
  border-color:transparent;background-clip:padding-box;position:relative}
.front .lead{border:1px solid transparent}
.front .lead::before{inset:-1px;width:auto;height:auto;border:0;border-radius:inherit;opacity:1;padding:1.5px;
  background:linear-gradient(120deg,var(--accent),var(--accent2),var(--essay),var(--accent));background-size:300% 300%;animation:sweep 9s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.front .lead::after{display:none}
@keyframes sweep{to{background-position:300% 0}}
.front .lead h3{font:700 clamp(26px,3vw,38px)/1.12 var(--display);letter-spacing:-.02em;margin:10px 0 12px;padding-right:0}
.front .lead p{font-size:15.5px;-webkit-line-clamp:5}
.front .lead .no{display:none}
.kicker{display:inline-block;align-self:flex-start;font:700 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 9px;border-radius:3px;box-shadow:0 0 16px color-mix(in srgb,var(--accent) 50%,transparent)}
.front .tcard:not(.lead) h3{font-size:15.5px}
.front .tcard:not(.lead) p{-webkit-line-clamp:2}
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media (max-width:1100px){.front{grid-template-columns:1fr 1fr}.front .lead{grid-column:1/-1;grid-row:auto;min-height:260px}}
@media (max-width:640px){.front{grid-template-columns:1fr}}
@media (max-width:880px){.ticker b{padding:0 10px}}
@media print{.ticker{display:none}}

/* ================= round 3: type, light, depth ================= */
body{font-family:var(--sans);letter-spacing:-.005em;font-variant-numeric:lining-nums}
.tcard h3,.row h3,.subj h3,.topic h2,.qtext,.mcq .qq,.mains .q,.fface .ft{font-family:var(--display)}
.tcard h3{font-weight:700;letter-spacing:-.01em}
.prose p{font-size:16.5px;line-height:1.75}
.topic .prose p:first-of-type::first-letter{float:left;font:800 3.4em/.82 var(--display);margin:6px 10px 0 0;color:var(--accent);text-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}

/* glass sidebar */
.side{background:color-mix(in srgb,var(--side) 72%,transparent);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}

/* aurora behind the masthead */
.mast{isolation:isolate}
.aurora{position:absolute;inset:-60px -40px -20px -40px;z-index:-1;pointer-events:none;filter:blur(40px);opacity:.55;
  background:radial-gradient(40% 60% at 15% 40%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 70%),
             radial-gradient(35% 55% at 60% 30%,color-mix(in srgb,var(--accent2) 45%,transparent),transparent 70%),
             radial-gradient(30% 50% at 90% 60%,color-mix(in srgb,var(--essay) 30%,transparent),transparent 70%);
  animation:drift 16s ease-in-out infinite alternate}
:root[data-theme="light"] .aurora{opacity:.28}
@keyframes drift{to{transform:translateX(4%) translateY(-6%) scale(1.06)}}
.wordmark{background:linear-gradient(180deg,var(--ink) 55%,color-mix(in srgb,var(--ink) 55%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.wordmark i{-webkit-text-fill-color:var(--accent)}

/* cards: a light that follows the pointer, and a slight 3D tilt */
.tcard,.tile,.qcard,.subj,.row{--mx:50%;--my:50%;transition:transform .18s ease,border-color .2s,box-shadow .2s;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.tcard:hover,.tile:hover,.qcard:hover,.subj:hover,.row:hover{background-image:radial-gradient(280px circle at var(--mx) var(--my),color-mix(in srgb,var(--accent) 13%,transparent),transparent 65%),linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,#fff 3%),var(--card))}
.front .lead:hover{background-image:radial-gradient(420px circle at var(--mx) var(--my),color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%),radial-gradient(520px 260px at 0 0,var(--accent-soft),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--card) 100%,#fff 4%),var(--card))}

.tile .v,.tnum,.day .dn,.wordmark,h1,.score b,.hud b{font-variant-numeric:lining-nums tabular-nums}
/* reading progress */
.readbar{position:fixed;top:0;left:0;height:2px;width:0;z-index:60;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 12px var(--accent);transition:width .08s linear}

/* nav polish */
.navlink{transition:background .15s,color .15s}
.navlink svg.i{opacity:.75}.navlink.on svg.i{opacity:1;color:var(--accent);filter:drop-shadow(0 0 6px var(--accent))}
.day .dn{font-family:var(--display)}
@media (prefers-reduced-motion:reduce){.aurora{animation:none}.tcard,.tile,.qcard,.subj,.row{transform:none!important}}
@media print{.aurora,.readbar{display:none}}

/* ================= calm pass: fewer effects, more air ================= */
:root{--grid:rgba(110,150,255,.025)}
:root[data-theme="light"]{--grid:rgba(20,50,120,.03)}
:root[data-theme="dark"] body::after{display:none}
body::before{background:
  radial-gradient(900px 520px at 88% -12%,rgba(0,229,255,.05),transparent 62%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/56px 56px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/56px 56px}
.aurora{opacity:.18;animation:none}
:root[data-theme="light"] .aurora{opacity:.1}
.wordmark:hover{animation:none}
.wordmark i{text-shadow:none}
.mast::after{box-shadow:none;width:64px}

/* labels: quieter */
.eyebrow::before{content:none}
.eyebrow{letter-spacing:.12em}
.navlabel,.month{letter-spacing:.12em}
.tagline,.edition{letter-spacing:.14em}
.edition{color:var(--muted);opacity:1}
.hud{letter-spacing:.08em}
.hud .live::before{animation:none;box-shadow:none}
.sec>h4{letter-spacing:.12em;color:var(--ink2)}
.sec>h4::before{content:none}
.badge{text-transform:none;letter-spacing:.02em;font-size:11px}
.tile .k{letter-spacing:.1em}
.tile .v{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}

/* cards: plain surfaces, no brackets, no tilt, gentle hover */
.tcard::before,.tile::before,.subj::before,.qcard::before,.panel::before,.topic::before,
.tcard::after,.tile::after,.subj::after,.qcard::after,.panel::after,.topic::after{display:none}
.tcard,.qcard,.panel,.tile,.subj,.mcq,.concept,.mains,.row,.fface,.lockcard,.topic{background:var(--card);border-color:var(--line)}
.tcard,.tile,.qcard,.subj,.row{transform:none!important}
.tcard:hover,.tile:hover,.row:hover,.qcard:hover,.subj:hover{border-color:var(--line2);box-shadow:none;background-image:radial-gradient(320px circle at var(--mx) var(--my),color-mix(in srgb,var(--accent) 5%,transparent),transparent 70%)}
.tnum{-webkit-text-stroke:0;color:var(--line2);opacity:1;font-weight:500}
.why{background:var(--accent-soft)}

/* lead story: a quiet accent instead of the animated rainbow edge */
.front .lead{border:1px solid var(--line2);background:var(--card)}
.front .lead::before{display:none}
.front .lead:hover{background-image:radial-gradient(420px circle at var(--mx) var(--my),color-mix(in srgb,var(--accent) 5%,transparent),transparent 70%)}
.front .lead{box-shadow:inset 3px 0 0 var(--accent)}
.kicker{background:none;color:var(--accent);padding:0;box-shadow:none;letter-spacing:.14em}

/* ticker: calmer */
.ticker{background:none;border-color:var(--line)}
.ticker b{background:none;color:var(--accent);border-right:1px solid var(--line)}
.ticker b::before{animation:none;background:var(--accent)}
.ticker .track{animation-duration:200s}
.ticker span{color:var(--muted)}
.ticker span::before{content:"·";font-size:14px}

/* controls: no neon */
.go{box-shadow:none}
.pchip.on,.seg button.on{box-shadow:none}
.tab.on{text-shadow:none}
.bar i,.brow .bar i{box-shadow:none}
.logo{box-shadow:none}
.tick.yes,.iconbtn.rev.on,.opt.right{box-shadow:none}
.opt.right{border-color:var(--good)}
.navlink.on svg.i{filter:none}
.readbar{box-shadow:none;height:2px}
.topic .prose p:first-of-type::first-letter{text-shadow:none;font-size:3em}
.side{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--side)}
@media (prefers-reduced-motion:no-preference){.tcard,.qcard,.tile,.subj,.panel{animation-duration:.3s}}

/* ================= newspaper type ================= */
:root{
  --mast:"UnifrakturMaguntia","Old English Text MT",serif;
  --display:"Playfair Display",Georgia,serif;
  --serif:"Playfair Display",Georgia,serif;
  --body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --label:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --mono:var(--label);
  --sans:var(--body);
}
body{font-family:var(--body);font-size:17px;letter-spacing:0}
.prose p,.list li,.statics li,.facts li,.concept span,.why,.explain,.outline p,.tcard p,.row p,.fb{font-family:var(--body)}
.prose p{font-size:17.5px;line-height:1.7}
.tcard p{font-size:14.5px}
/* masthead: blackletter nameplate */
.wordmark{font:400 clamp(46px,7vw,88px)/1 var(--mast);letter-spacing:0;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
.wordmark i{-webkit-text-fill-color:currentColor;color:var(--ink)}
/* labels, dates, navigation: Franklin-style sans */
.eyebrow,.navlabel,.month,.qhead,.tab,.meta,.score,.from,.tagline,.edition,.hud,.hud b,.badge,.kicker,.tile .k,.sec>h4,.why b,.ticker b,.ticker span,
.navlink,.btn,.iconbtn,.go,.pchip,.seg button,.themebtn,.kw,.day .dw,.brand span,.search input,.filters select,.filters input,.setup select,.toggle,.rail a,.rail h6,.disclaimer,.litechip,h2.sec-title a,#stat{font-family:var(--label)}
.eyebrow,.navlabel,.month,.tagline,.edition,.tile .k,.sec>h4,.why b,.kicker,.ticker b,.rail h6{font-weight:600;letter-spacing:.08em}
.hud,.hud b{letter-spacing:.04em}
.tcard .no,.tnum{font-family:var(--display)}
.tnum{font-weight:700;font-style:italic}
.tile .v{font-family:var(--display);font-weight:700}
h1,h2.sec-title,.panel h2,.topic h2,.tcard h3,.row h3,.subj h3,.qtext,.mcq .qq,.mains .q,.fface .ft{font-family:var(--display)}
h2.sec-title,.panel h2{text-transform:none;font-weight:700;font-style:italic}
.qtext,.mcq .qq,.mains .q{font-family:var(--body);font-weight:600}
.opt{font-family:var(--body)}
.topic .prose p:first-of-type::first-letter{font-family:var(--display);font-weight:800}

/* ================= newsprint: the default look ================= */
:root[data-theme="light"]{
  --bg:#f3eee4; --side:#efe9dd; --card:#f8f4ec; --ink:#141210; --ink2:#2e2a25; --muted:#6e675c;
  --line:#d8cfbf; --line2:#bdb3a2; --hover:#e9e2d4; --grid:transparent;
  --accent:#a3161a; --accent2:#141210; --accent-ink:#f8f4ec; --accent-soft:rgba(163,22,26,.06);
  --good:#1f5e3a; --good-soft:rgba(31,94,58,.08); --bad:#a3161a; --bad-soft:rgba(163,22,26,.07);
  --fact:#efe7d4; --fact-line:#cfc3a8;
  --gs1:#7a4e12; --gs2:#1d3f7a; --gs3:#1f5e3a; --gs4:#5a2d82; --essay:#8a1f52; --prelims:#4a4a4a;
  --glow:none; --shadow:none;
}
:root[data-theme="light"] body::before{background:none}
:root[data-theme="light"] .aurora{display:none}
:root[data-theme="light"] .side{border-right:1px solid var(--ink)}
:root[data-theme="light"] .logo{background:var(--ink);color:var(--bg);border-radius:2px}
/* stories separated by printed rules, not floating boxes */
:root[data-theme="light"] .tcard,:root[data-theme="light"] .tile,:root[data-theme="light"] .qcard,:root[data-theme="light"] .subj,
:root[data-theme="light"] .panel,:root[data-theme="light"] .topic,:root[data-theme="light"] .row{background:transparent;border:0;border-top:1px solid var(--ink);border-radius:0;box-shadow:none}
:root[data-theme="light"] .tcard:hover,:root[data-theme="light"] .tile:hover,:root[data-theme="light"] .row:hover,
:root[data-theme="light"] .qcard:hover,:root[data-theme="light"] .subj:hover{background-image:none;background:var(--hover)}
:root[data-theme="light"] .front{gap:0 22px}
:root[data-theme="light"] .front .tcard{padding:14px 0 18px}
:root[data-theme="light"] .front .tcard:not(.lead){border-top:1px solid var(--line2)}
:root[data-theme="light"] .front .lead{border-top:3px double var(--ink);border-right:1px solid var(--line2);padding:16px 22px 18px 0;box-shadow:none;background:transparent;justify-content:flex-start}
:root[data-theme="light"] .front .lead:hover{background-image:none;background:transparent}
:root[data-theme="light"] .grid{gap:0 22px}
:root[data-theme="light"] .grid .tcard{padding:14px 0 16px}
:root[data-theme="light"] .tiles{gap:0;border-top:3px double var(--ink);border-bottom:1px solid var(--ink)}
:root[data-theme="light"] .tile{border-top:0;border-right:1px solid var(--line2);padding:12px 16px}
:root[data-theme="light"] .tile:last-child{border-right:0}
:root[data-theme="light"] .topic{padding:22px 0;border-top:3px double var(--ink)}
:root[data-theme="light"] .concept,:root[data-theme="light"] .mcq,:root[data-theme="light"] .mains,:root[data-theme="light"] .opt{background:transparent;border-color:var(--line2);border-radius:2px}
:root[data-theme="light"] .why{background:transparent;border-left:3px solid var(--accent)}
:root[data-theme="light"] .statics{background:transparent;border-left-color:var(--ink)}
:root[data-theme="light"] .badge{border-radius:2px;background:transparent}
:root[data-theme="light"] .btn,:root[data-theme="light"] .iconbtn,:root[data-theme="light"] .pchip,:root[data-theme="light"] .search input,
:root[data-theme="light"] .filters select,:root[data-theme="light"] .filters input,:root[data-theme="light"] .seg{border-radius:2px;background:transparent;border-color:var(--ink2)}
:root[data-theme="light"] .go{background:var(--ink);color:var(--bg);border-radius:2px}
:root[data-theme="light"] .pchip.on,:root[data-theme="light"] .seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root[data-theme="light"] .navlink.on,:root[data-theme="light"] .day.on{background:transparent;box-shadow:inset 3px 0 0 var(--accent)}
:root[data-theme="light"] .navlink.on svg.i{color:var(--accent)}
:root[data-theme="light"] .ticker{border:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);border-radius:0}
:root[data-theme="light"] .ticker b{border-right:1px solid var(--ink)}
:root[data-theme="light"] .bar i,:root[data-theme="light"] .brow .bar i{background:var(--ink)}
:root[data-theme="light"] .readbar{background:var(--accent)}
:root[data-theme="light"] h2.sec-title::after,:root[data-theme="light"] .panel h2::after{background:var(--ink)}
:root[data-theme="light"] .tnum{color:var(--line2)}
:root[data-theme="light"] .lock{background:var(--bg)}
:root[data-theme="light"] .lockcard{border:0;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);border-radius:0;background:transparent}

/* classic masthead: centred nameplate between rules */
.mast{flex-direction:column;align-items:center;text-align:center;gap:10px;padding:4px 0 0;border-bottom:0}
.mast::after{display:none}
.mast > div:not(.aurora):not(.hud){display:flex;flex-direction:column;align-items:center}
.wordmark{font-size:clamp(52px,8vw,104px)}
.tagline{margin-top:4px}
.edition{display:none}
.hud{flex-direction:row;align-items:center;justify-content:space-between;width:100%;gap:16px;padding:7px 2px;border-top:1px solid var(--ink);border-bottom:3px double var(--ink);color:var(--ink2)}
:root:not([data-theme="light"]) .hud{border-color:var(--line2)}
.hud .edition-inline{flex:1;text-align:center}
.hud b{font-size:12px}
@media (max-width:880px){.hud{flex-wrap:wrap;justify-content:center;gap:4px 14px}.hud .edition-inline{flex-basis:100%;order:3}}
@media (max-width:880px){:root[data-theme="light"] .tile:nth-child(2n){border-right:0}:root[data-theme="light"] .tile:nth-child(n+3){border-top:1px solid var(--line2)}:root[data-theme="light"] .front .lead{border-right:0;padding-right:0}}

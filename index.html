/* =====================================================================
   the notes. — a newspaper-style reading app
   Layout and type modelled on the big news sites: centred nameplate, a
   section bar, stories separated by column rules, a "briefing" rail.
   ===================================================================== */
:root{
  --paper:#fbfaf6; --paper2:#f3f1ea; --ink:#121212; --ink2:#363636; --muted:#6b6b6b; --faint:#9a9a9a;
  --rule:#121212; --hair:#e2dfd7; --hair2:#cfcbc1; --hover:#f1eee6;
  --accent:#a3121f; --accent-ink:#fff; --accent-soft:rgba(163,18,31,.06);
  --good:#1d6b3f; --good-soft:#e7f1ea; --bad:#a3121f; --bad-soft:#f8e8e9; --fact:#f6f1e1; --fact-line:#e3d8b8;
  --gs1:#8a5a12; --gs2:#1f4f9a; --gs3:#1d6b3f; --gs4:#6b3a9e; --essay:#9c2b62; --prelims:#555;
  --mast:"UnifrakturMaguntia","Old English Text MT",serif;
  --head:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --label:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --max:1240px; color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#121212; --paper2:#1a1a1a; --ink:#ebe8e1; --ink2:#c9c5bc; --muted:#9b978f; --faint:#6f6c66;
  --rule:#ebe8e1; --hair:#2b2a28; --hair2:#3b3936; --hover:#1c1b19;
  --accent:#ff6b5e; --accent-ink:#121212; --accent-soft:rgba(255,107,94,.08);
  --good:#6fd39a; --good-soft:#15261c; --bad:#ff6b5e; --bad-soft:#2a1716; --fact:#211e15; --fact-line:#3d3622;
  --gs1:#e0aa52; --gs2:#8fb0ff; --gs3:#6fd39a; --gs4:#c29bff; --essay:#f08cbd; --prelims:#aaa;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.6 var(--body);font-optical-sizing:auto;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ink);color:var(--paper)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.label,.eyebrow,.meta,.navlabel,.month,.badge,.kw,.btn,.go,.iconbtn,.pchip,.tab,.seg button,.qhead,.from,.score,.toggle,.rail,.drawer,.sectionnav,.mh-top,.mh-sub,.filters,.setup,.disclaimer,.litechip,.kicker{font-family:var(--label)}

/* ---------------- masthead ---------------- */
.masthead{max-width:var(--max);margin:0 auto;padding:0 28px;text-align:center}
.mh-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 0 2px;font-size:12px;color:var(--ink2)}
.mh-top .left{display:flex;align-items:center;gap:14px;justify-self:start}
.mh-top .right{justify-self:end}
.menubtn{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:6px 0;cursor:pointer;font:600 12px var(--label);letter-spacing:.06em;text-transform:uppercase}
.menubtn:hover{color:var(--accent)}
.mh-date{display:flex;flex-direction:column;line-height:1.35;text-align:left}
.mh-date b{font-weight:700;color:var(--ink)}
.search{position:relative;display:block}
.search input{width:220px;border:1px solid var(--hair2);background:var(--paper);border-radius:2px;padding:7px 10px 7px 30px;font:400 13px var(--label);outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);width:14px;height:14px}
.search kbd{display:none}
.nameplate{display:inline-block;font:400 clamp(48px,7.4vw,92px)/1 var(--mast);color:var(--ink);margin:6px 0 2px;letter-spacing:0}
.nameplate:hover{text-decoration:none}
.nameplate i{font-style:normal;color:var(--accent)}
.mh-sub{display:flex;justify-content:center;gap:14px;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);padding:2px 0 10px}
.mh-sub span+span::before{content:"·";margin-right:14px;color:var(--faint)}
.sectionnav{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 26px;border-top:1px solid var(--rule);border-bottom:3px double var(--rule);padding:9px 0}
.sectionnav .navlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);padding:2px 0;border-bottom:2px solid transparent}
.sectionnav .navlink svg{display:none}
.sectionnav .navlink:hover{text-decoration:none;color:var(--accent)}
.sectionnav .navlink.on{border-bottom-color:var(--accent)}
.navlink .n{font-size:11px;font-weight:700;color:var(--muted)}
.navlink .n.due{color:var(--accent-ink);background:var(--accent);border-radius:9px;padding:0 6px}

/* ---------------- page shell ---------------- */
.app{max-width:var(--max);margin:0 auto;padding:0 28px;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:44px}
.app.norail{grid-template-columns:minmax(0,1fr)}
.main{min-width:0;padding:26px 0 110px}
.wrap{max-width:760px;margin:0 auto}.wrap.wide{max-width:none}
.rail{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:30px 0 30px}
.rail h6{font:700 11px var(--label);letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.rail a{display:flex;gap:8px;font:500 13px/1.35 var(--label);color:var(--ink2);padding:7px 0;border-bottom:1px solid var(--hair)}
.rail a:hover{color:var(--accent);text-decoration:none}.rail a.on{color:var(--accent);font-weight:600}
.rail a .rt{margin-left:auto;color:var(--good);font-weight:700}
.readbar{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:var(--accent)}

/* ---------------- drawer (sections, archive, settings) ---------------- */
.scrim{display:none}
body.menu .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35)}
.drawer{position:fixed;z-index:40;left:0;top:0;bottom:0;width:320px;max-width:88vw;overflow:auto;background:var(--paper);border-right:1px solid var(--rule);
  transform:translateX(-102%);transition:transform .22s ease;padding:18px 22px 22px;display:flex;flex-direction:column;gap:18px;text-align:left}
body.menu .drawer{transform:none;box-shadow:0 0 40px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:22%;flex:none}
.brand b{display:block;font:400 22px/1 var(--mast)}.brand span{font-size:11.5px;color:var(--muted)}
.drawer .nav{display:flex;flex-direction:column}
.drawer .navlink{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px;font-weight:600}
.drawer .navlink.on{color:var(--accent)}
.navlabel{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.papers{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--hair2);border-radius:2px;padding:3px 9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pchip:hover{border-color:var(--ink);text-decoration:none}.pchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}
.month{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.day{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--hair);font-family:var(--label);font-size:13px}
.day:hover{text-decoration:none;color:var(--accent)}.day.on{color:var(--accent)}
.day .dn{font:700 18px/1 var(--head);text-align:center}
.day .dw{color:var(--muted);font-size:11.5px;line-height:1.25}.day .dw b{display:block;color:var(--ink2);font-weight:600;font-size:13px}
.ring{width:20px;height:20px}
.sidefoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--hair);font:500 12px var(--label);color:var(--muted)}
.topbar{display:none}

/* ---------------- shared bits ---------------- */
.eyebrow,.kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(34px,4.6vw,52px)/1.08 var(--head);letter-spacing:-.015em;margin:8px 0 12px}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.pager{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--ink);background:none;border-radius:2px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ink);color:var(--paper);text-decoration:none}.btn[aria-disabled="true"],.btn:disabled{opacity:.3;pointer-events:none}
.btn.sm{padding:3px 9px;font-size:11.5px}
.go{border:0;background:var(--ink);color:var(--paper);border-radius:2px;padding:9px 18px;font-size:13px;font-weight:700;letter-spacing:.02em;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.go:hover{background:var(--accent);text-decoration:none}
h2.sec-title{display:flex;align-items:baseline;gap:14px;font:700 22px/1.2 var(--head);margin:40px 0 0;padding:10px 0 12px;border-top:2px solid var(--rule)}
h2.sec-title a{margin-left:auto;font:600 12px var(--label);color:var(--accent)}
.panel{border-top:1px solid var(--rule);padding:14px 0 20px;margin-bottom:22px}
.panel h2{font:700 20px/1.25 var(--head);margin:0 0 12px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.badge+.badge::before{content:"·";color:var(--faint);margin:0 6px 0 0}
.gsl{display:flex;flex-wrap:wrap;gap:0 6px}
.empty{color:var(--muted);text-align:center;padding:60px 0;font-family:var(--label);font-size:14px}
.disclaimer{font-size:12px;color:var(--muted);text-align:center;margin:44px auto 0;max-width:600px;padding-top:14px;border-top:1px solid var(--hair)}
mark{background:var(--fact);color:inherit;padding:0 2px}
.progress{margin:16px 0 22px;display:flex;align-items:center;gap:12px;font:500 12.5px var(--label);color:var(--muted)}
.bar{flex:1;height:3px;background:var(--hair);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.litechip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gs1)}

/* ---------------- front page ---------------- */
.front{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) 270px;border-top:1px solid var(--rule)}
.front>*{padding:18px 22px 22px}
.front>*:first-child{padding-left:0}.front>*:last-child{padding-right:0}
.front>*+*{border-left:1px solid var(--hair)}
.story{display:block;color:var(--ink)}
.story:hover{text-decoration:none}.story:hover h2,.story:hover h3{color:var(--accent)}
.story .kicker{display:block;margin-bottom:6px}
.lead h2{font:700 clamp(30px,3.4vw,44px)/1.07 var(--head);letter-spacing:-.015em;margin:0 0 12px}
.lead p{font-size:19px;line-height:1.5;color:var(--ink2);margin:0 0 12px}
.lead .readmore{font:700 12.5px var(--label);color:var(--accent)}
.col .story{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--hair)}
.col .story:last-child{border-bottom:0;margin-bottom:0}
.col h3{font:700 20px/1.2 var(--head);margin:0 0 6px}
.col p{font-size:15.5px;line-height:1.45;color:var(--ink2);margin:0}
.briefing h4{font:700 12px var(--label);letter-spacing:.12em;text-transform:uppercase;margin:0 0 4px}
.briefing .sub{font:400 13px var(--label);color:var(--muted);margin:0 0 12px}
.briefing ol{margin:0;padding:0;list-style:none;counter-reset:b}
.briefing li{counter-increment:b;position:relative;padding:9px 0 9px 26px;border-top:1px solid var(--hair);font-size:15px;line-height:1.4}
.briefing li::before{content:counter(b);position:absolute;left:0;top:9px;font:700 13px var(--label);color:var(--accent)}
.more-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.more-grid .story{padding:14px 18px 18px;border-left:1px solid var(--hair)}
.more-grid .story:nth-child(4n+1){border-left:0;padding-left:0}
.more-grid .story:nth-child(n+5){border-top:1px solid var(--hair)}
.more-grid h3{font:700 18px/1.22 var(--head);margin:0 0 6px}
.more-grid p{font-size:14.5px;line-height:1.45;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--rule);margin-top:40px}
.band>section{padding:14px 22px 6px}
.band>section:first-child{padding-left:0}.band>section:last-child{padding-right:0}
.band>section+section{border-left:1px solid var(--hair)}
.band h4{font:700 12px var(--label);letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hair);font:500 13.5px var(--label);color:var(--ink2)}
.stat b{font:700 22px var(--head);color:var(--ink)}
.stat:hover{text-decoration:none;color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font:500 13px var(--label)}
.brow .bar i{background:var(--c,var(--ink))}.brow .pct{text-align:right;color:var(--muted)}

/* ---------------- day page: story list ---------------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule);margin-bottom:26px}
.tcard{display:block;padding:14px 18px 18px;border-left:1px solid var(--hair);border-bottom:1px solid var(--hair);position:relative;color:var(--ink)}
.tcard:nth-child(3n+1){border-left:0;padding-left:0}
.tcard:hover{text-decoration:none}.tcard:hover h3{color:var(--accent)}
.tcard .no{font:700 12px var(--label);color:var(--accent)}
.tcard h3{font:700 18px/1.22 var(--head);margin:4px 0 6px;padding-right:22px}
.tcard p{font-size:14.5px;line-height:1.45;color:var(--ink2);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tick{position:absolute;top:14px;right:0;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--hair2)}
.tcard:nth-child(3n+2) .tick,.tcard:nth-child(3n+3) .tick{right:16px}
.tick.yes{background:var(--good);border-color:var(--good)}
.bites{margin:0;padding:0;list-style:none;columns:2;column-gap:36px}
.bites li{break-inside:avoid;font-size:15px;padding:8px 0;border-bottom:1px solid var(--hair)}
.bites a{font:600 11.5px var(--label);color:var(--accent);margin-left:4px}

/* ---------------- article ---------------- */
.topic{border-top:2px solid var(--rule);padding:22px 0 26px;margin-top:34px}
.thead{display:block}
.tnum{display:none}
.topic .gsl{margin-bottom:6px}
.topic h2{font:700 clamp(28px,3.4vw,40px)/1.1 var(--head);letter-spacing:-.015em;margin:2px 0 10px}
.syl{font:500 13px/1.45 var(--label);color:var(--muted)}
.why{margin:18px 0 6px;font:400 italic 21px/1.45 var(--head);color:var(--ink2);padding:0 0 16px;border-bottom:1px solid var(--hair)}
.why b{display:block;font:700 11.5px var(--label);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.sec{margin-top:28px}
.sec>h4{font:700 12px var(--label);letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;padding-top:10px;border-top:1px solid var(--hair2)}
.prose p{margin:0 0 14px;font-size:18.5px;line-height:1.65}
.topic .prose p:first-of-type::first-letter{float:left;font:700 3.5em/.8 var(--head);margin:6px 8px 0 0;color:var(--ink)}
.list{margin:0;padding:0 0 0 20px}
.list li{padding:3px 0;font-size:17.5px;line-height:1.55}
.list li::marker{color:var(--accent)}
ol.steps{margin:0;padding:0 0 0 22px}
ol.steps li{padding:3px 0;font-size:17.5px;line-height:1.55}
ol.steps li::marker{font:700 14px var(--label);color:var(--accent)}
.statics{margin:0;padding:12px 16px;list-style:none;background:var(--paper2);border-left:3px solid var(--ink)}
.statics li{font-size:16.5px;line-height:1.55;padding:4px 0}
.concepts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.concept{padding:10px 0;border-bottom:1px solid var(--hair)}
.concept b{display:block;font:700 15px var(--label);margin-bottom:2px}.concept span{font-size:16px;line-height:1.5;color:var(--ink2)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.side-good h5,.side-bad h5{font:700 12px var(--label);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
.side-good h5{color:var(--good)}.side-bad h5{color:var(--bad)}
.facts{margin:0;padding:0;list-style:none;border-top:1px solid var(--hair)}
.facts li{padding:8px 0 8px 22px;border-bottom:1px solid var(--hair);font-size:16.5px;position:relative}
.facts li::before{content:"■";position:absolute;left:0;top:9px;font-size:9px;color:var(--accent)}
.mains{background:var(--paper2);padding:16px 18px}
.mains .q{font:600 19px/1.45 var(--head);margin:0 0 6px;white-space:pre-line}
.toggle{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0}
.reveal{margin-top:6px;display:none}.reveal.open{display:block}
.mcq{border-top:1px solid var(--hair);padding:14px 0 6px;margin-top:6px}
.mcq .qq{font:500 18px/1.5 var(--head);margin-bottom:10px;white-space:pre-line}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--hair2);background:none;border-radius:2px;padding:8px 12px;cursor:pointer;font:400 16px/1.45 var(--body)}
.opt:hover{border-color:var(--ink)}
.opt .l{flex:none;font:700 13px/1.7 var(--label);color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.right .l{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .l{color:var(--bad)}
.mcq.done .opt{cursor:default}
.explain{display:none;margin-top:10px;font-size:16px;line-height:1.55;color:var(--ink2);padding:10px 0 4px;border-top:1px dashed var(--hair2)}
.mcq.done .explain{display:block}
.explain b{font-family:var(--label);font-size:13px}
.ai{font:600 11px var(--label);color:var(--muted);margin-left:6px}
.tfoot{margin-top:26px;padding-top:12px;border-top:1px solid var(--hair);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kws{display:flex;flex-wrap:wrap;gap:4px 12px;flex:1}.kw{font-size:12px;font-weight:600;color:var(--muted)}
.kw::before{content:"#";color:var(--faint)}
.srcs{font:500 12.5px var(--label);color:var(--muted);width:100%}.srcs a{color:var(--accent);margin-right:12px}
.acts{display:flex;gap:6px;align-items:center}
.iconbtn{border:1px solid var(--hair2);background:none;border-radius:2px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn svg{width:13px;height:13px}
.iconbtn.star.on{color:var(--accent);border-color:var(--accent)}.iconbtn.star.on svg{fill:var(--accent)}
.iconbtn.rev.on{background:var(--good);border-color:var(--good);color:#fff}
.iconbtn.note.on{color:var(--gs2);border-color:var(--gs2)}
.notebox{width:100%;display:none}.notebox.open{display:block}
.notebox textarea{width:100%;min-height:90px;border:1px solid var(--hair2);background:var(--paper2);border-radius:2px;padding:10px 12px;font:400 16px var(--body);resize:vertical;outline:none}
.notebox small{font:400 12px var(--label);color:var(--muted)}

/* ---------------- PYQs, subjects, lists ---------------- */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin:18px 0 16px;overflow-x:auto}
.tab{padding:8px 0;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink);text-decoration:none}.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-weight:500;font-size:12px;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--hair)}
.filters select,.filters input[type=search],.setup select{border:1px solid var(--hair2);background:var(--paper);border-radius:2px;padding:7px 10px;font:500 13px var(--label);outline:none;max-width:100%}
.filters input[type=search]{flex:1;min-width:160px}
.filters label{font-size:13px;display:inline-flex;gap:6px;align-items:center}
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule)}
.subj{padding:14px 20px 18px;border-left:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.subj:nth-child(3n+1){border-left:0;padding-left:0}
.subj h3{font:700 19px/1.25 var(--head);margin:0 0 8px}
.subj a{display:flex;justify-content:space-between;gap:8px;font:500 13.5px var(--label);color:var(--ink2);padding:4px 0}
.subj a span{color:var(--muted);font-size:12px}.subj a:hover{color:var(--accent);text-decoration:none}
.qcard{padding:16px 0 18px;border-top:1px solid var(--hair2)}
.qhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.qhead b{color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
.qhead a{color:var(--ink2);font-weight:600}
.qtext{font:600 19px/1.45 var(--head);white-space:pre-line;margin:0 0 6px}
.qcard .mcq{border:0;padding:0;margin:0}
.outline h5{margin:12px 0 4px;font:700 11.5px var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.outline p{margin:0;font-size:17px;line-height:1.55}
.more{display:flex;justify-content:center;margin:20px 0}
.row{display:grid;grid-template-columns:90px 1fr auto;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair);color:var(--ink);align-items:start}
.row:hover{text-decoration:none}.row:hover h3{color:var(--accent)}
.row .rd{font:500 12px/1.35 var(--label);color:var(--muted)}.row .rd b{display:block;font:700 22px/1.1 var(--head);color:var(--ink)}
.row h3{font:700 19px/1.3 var(--head);margin:0 0 4px}.row p{margin:0;font-size:15.5px;color:var(--ink2)}
.row .mynote{margin-top:6px;font-size:15px;background:var(--paper2);padding:8px 10px;white-space:pre-line}
a.row{grid-template-columns:90px 1fr}

/* ---------------- practice, flashcards ---------------- */
.setup{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 22px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--ink)}.seg button.on{background:var(--ink);color:var(--paper)}
.score{display:flex;gap:18px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.score b{color:var(--ink);font:700 20px var(--head)}
.from{font-size:12.5px;color:var(--muted);margin-top:8px}.from a{color:var(--accent)}
.fcard{cursor:pointer;margin:10px 0 16px}
.fface{border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:36px 20px;min-height:250px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.fface .ft{font:700 clamp(24px,3.2vw,34px)/1.2 var(--head)}
.fface .fb{font-size:18.5px;line-height:1.6;color:var(--ink2);padding-top:14px;border-top:1px solid var(--hair)}
.fface .fm{font:500 12px var(--label);color:var(--muted)}
.fbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fbtns button{border:1px solid var(--ink);background:none;border-radius:2px;padding:10px 6px;cursor:pointer;font:700 13px var(--label)}
.fbtns button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.fbtns .again{color:var(--bad)}.fbtns .good{color:var(--good)}

/* ---------------- lock ---------------- */
.lock{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;padding:16px}
.lock[hidden]{display:none}
.lockcard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center;border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:26px 4px}
.lockcard .logo{margin:0 auto;width:52px;height:52px}
.lockcard h1{font:400 46px/1 var(--mast);margin:4px 0}
.lockcard p{margin:0 0 6px;color:var(--muted);font:400 14px var(--label)}
.lockcard input[type=password]{border:1px solid var(--hair2);background:var(--paper);border-radius:2px;padding:11px 12px;font:400 15px var(--label);outline:none}
.lockcard input[type=password]:focus{border-color:var(--ink)}
.lockcard .go{justify-content:center}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;font:400 13px var(--label);color:var(--muted)}
.lockerr{min-height:18px;font:500 13px var(--label);color:var(--bad)}

/* ---------------- responsive ---------------- */
@media (max-width:1180px){.app{grid-template-columns:minmax(0,1fr)}.rail{display:none}
  .front{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.front .briefing{grid-column:1/-1;border-left:0;border-top:1px solid var(--rule);padding-left:0}
  .more-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.more-grid .story:nth-child(4n+1){border-left:1px solid var(--hair);padding-left:18px}.more-grid .story:nth-child(3n+1){border-left:0;padding-left:0}.more-grid .story:nth-child(n+4){border-top:1px solid var(--hair)}}
@media (max-width:760px){
  body{font-size:17px}
  .masthead,.app{padding:0 16px}
  .mh-top{grid-template-columns:auto 1fr auto}.mh-date{display:none}.search input{width:150px}
  .mh-sub{font-size:10.5px;gap:8px;flex-wrap:wrap}#hud-e2{display:none}.mh-sub span+span::before{margin-right:8px}
  .sectionnav{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;gap:18px;padding:8px 0}
  .sectionnav .navlink{white-space:nowrap}
  .front,.band,.more-grid,.grid,.subjects,.concepts,.duo{grid-template-columns:minmax(0,1fr)}
  .front>*,.band>section,.more-grid .story,.tcard,.subj{border-left:0!important;padding-left:0!important;padding-right:0!important}
  .front>*+*,.band>section+section,.more-grid .story+.story,.tcard+.tcard,.subj+.subj{border-top:1px solid var(--hair)}
  .bites{columns:1}
  .tick,.tcard:nth-child(3n+2) .tick,.tcard:nth-child(3n+3) .tick{right:0}
  .row,a.row{grid-template-columns:1fr;gap:4px}.row .rd b{display:inline;font-size:15px;margin-right:6px}
  .fbtns{grid-template-columns:repeat(2,1fr)}
  .pager{margin-left:0}
}
@media print{.masthead .mh-top,.sectionnav,.drawer,.rail,.pager,.progress,.grid,.acts,.toggle,.filters,.tabs,.readbar{display:none!important}.app{display:block}.reveal{display:block!important}.mcq .explain{display:block}}

.cover.hero{aspect-ratio:3/1;margin:14px 0 16px}
.lead .cover.hero{aspect-ratio:16/9;margin:0 0 16px}
.cover.sq{width:96px;height:96px;aspect-ratio:1;margin:0;flex:none}
.cover.thumb{aspect-ratio:2/1}
.col .story.side{display:flex;gap:14px;align-items:flex-start}
.col .story.side>div{flex:1;min-width:0}
.col p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story:hover .cover,.tcard:hover .cover{filter:saturate(1.3) contrast(1.05)}
.story .kicker,.tcard .no{color:var(--accent)}
.numbers{margin:34px 0 0;border-top:2px solid var(--rule);padding-top:10px}
.numbers h4{font:700 12px var(--label);letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px}
.nrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nrow a{padding:4px 18px 8px;border-left:1px solid var(--hair);color:var(--ink)}
.nrow a:first-child{border-left:0;padding-left:0}
.nrow a:hover{text-decoration:none}.nrow a:hover b{color:var(--accent)}
.nrow b{display:block;font:800 clamp(30px,3.4vw,44px)/1.05 var(--head);letter-spacing:-.02em;margin-bottom:6px;color:var(--ink)}
.nrow span{display:block;font-size:14.5px;line-height:1.45;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.srcs a{margin-right:14px}
.sectionnav .navlink.on{color:var(--accent)}
.nameplate i{display:inline-block;transform:translateY(-.02em)}
@media (max-width:1180px){.nrow{grid-template-columns:repeat(2,minmax(0,1fr))}.nrow a:nth-child(3){border-left:0;padding-left:0}.nrow a:nth-child(n+3){border-top:1px solid var(--hair);padding-top:12px}}
@media (max-width:760px){.cover.sq{width:84px;height:84px}.nrow{grid-template-columns:1fr}.nrow a{border-left:0!important;padding-left:0!important;border-top:1px solid var(--hair)}}
</style>
</head>

      <div class="mh-date"><b id="hud-d"></b><span id="hud-t"></span></div>
